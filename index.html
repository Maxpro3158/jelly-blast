<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Jelly Blast</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#30236b;color:white;font-family:Arial;text-align:center}
h1{margin:15px 0 5px;color:#ff5ba8;font-size:38px;text-shadow:0 3px white,0 5px #29165c}
#score{font-size:20px;margin:8px}
#board{width:94vw;max-width:440px;margin:auto;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#100d30;padding:7px;border-radius:18px}
.cell{aspect-ratio:1;background:#211b4b;border-radius:7px}
.jelly{width:100%;height:100%;border-radius:7px;box-shadow:inset 3px 3px #fff9,inset -3px -4px #0004}
.blue{background:#20aaff}.green{background:#63d934}.pink{background:#ff3d95}
#pieces{height:130px;margin:15px auto;background:#17133f;border:3px solid #766de0;border-radius:18px;display:flex;justify-content:space-around;align-items:center;max-width:440px}
.piece{width:90px;height:90px;position:relative;touch-action:none}
.p{position:absolute;width:25px;height:25px;border-radius:6px;box-shadow:inset 2px 2px #fff9}
button{background:#ff55a7;color:white;border:0;border-radius:12px;padding:10px 18px;font-weight:bold}
</style>
</head>
<body>

<h1>🍬 JELLY BLAST</h1>
<div id="score">SCORE: 0</div>

<div id="board"></div>

<div id="pieces">
<div class="piece" data-n="0">
<div class="p blue" style="left:5px;top:32px"></div>
<div class="p blue" style="left:32px;top:32px"></div>
<div class="p blue" style="left:59px;top:32px"></div>
</div>

<div class="piece" data-n="1">
<div class="p green" style="left:20px;top:20px"></div>
<div class="p green" style="left:20px;top:47px"></div>
<div class="p green" style="left:47px;top:47px"></div>
</div>

<div class="piece" data-n="2">
<div class="p pink" style="left:20px;top:20px"></div>
<div class="p pink" style="left:47px;top:20px"></div>
<div class="p pink" style="left:20px;top:47px"></div>
<div class="p pink" style="left:47px;top:47px"></div>
</div>
</div>

<p>👆 Hold a piece and drag it onto the board!</p>
<button onclick="location.reload()">New Game</button>

<script>
const board=document.getElementById("board");
let grid=Array(64).fill(null),score=0,drag=null;

for(let i=0;i<64;i++){
 let c=document.createElement("div");
 c.className="cell";
 board.appendChild(c);
}

function draw(){
 document.querySelectorAll(".cell").forEach((c,i)=>{
  c.innerHTML="";
  if(grid[i]){
   let j=document.createElement("div");
   j.className="jelly "+grid[i];
   c.appendChild(j);
  }
 });
 document.getElementById("score").textContent="SCORE: "+score;
}

document.querySelectorAll(".piece").forEach(piece=>{
 piece.addEventListener("pointerdown",e=>{
  e.preventDefault();
  drag=piece;
  piece.setPointerCapture(e.pointerId);
 });

 piece.addEventListener("pointerup",e=>{
  if(!drag)return;

  let r=board.getBoundingClientRect();
  let col=Math.floor((e.clientX-r.left)/(r.width/8));
  let row=Math.floor((e.clientY-r.top)/(r.height/8));

  let n=Number(piece.dataset.n);
  let shapes=[
   [[0,0],[1,0],[2,0]],
   [[0,0],[0,1],[1,1]],
   [[0,0],[1,0],[0,1],[1,1]]
  ];

  let shape=shapes[n];

  if(shape.every(([x,y])=>{
   let rr=row+y,cc=col+x;
   return rr>=0&&rr<8&&cc>=0&&cc<8&&!grid[rr*8+cc];
  })){
   shape.forEach(([x,y])=>grid[(row+y)*8+col+x]=["blue","green","pink"][n]);
   score+=shape.length*5;
   piece.style.visibility="hidden";
   draw();
  }

  drag=null;
 });
});
draw();
</script>
</body>
</html>
